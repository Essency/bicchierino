name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags — `git describe` (the Makefile's own
          # version derivation) needs tag refs that a shallow default
          # checkout doesn't fetch.
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # -Werror on top of the Makefile's own always-on -Wall -Wextra
      # -Wpedantic -Wformat=2 (see Makefile's own comment: those are
      # appended unconditionally, never dropped by a CFLAGS override —
      # this only adds strictness on top, it can't accidentally weaken
      # the baseline).
      - name: Build with warnings as errors
        run: |
          make clean
          make CC=${{ matrix.cc }} CFLAGS="-O2 -Werror"

      # Unit suites, built with the same -Werror strictness as the binary
      # above: a warning introduced by a test is a warning either way, and
      # letting tests compile dirtier than the code they check is how the
      # baseline erodes.
      - name: Unit tests
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Werror" check

      - name: Binary sanity check
        run: ./bicchierino --config /nonexistent-config 2>&1 | grep -q "cannot open config file" || (echo "unexpected startup behavior" && exit 1)

      - name: Version is real, not the no-tags fallback
        run: |
          v=$(./bicchierino --version)
          echo "$v"
          echo "$v" | grep -vq 'v0\.0\.0+unknown' || (echo "version derivation produced the total-fallback value — checkout history/tags are missing" && exit 1)

  sanitizers:
    name: ASan/UBSan build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags — `git describe` (the Makefile's own
          # version derivation) needs tag refs that a shallow default
          # checkout doesn't fetch.
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev python3

      # No -Werror here on purpose: this job's goal is runtime
      # instrumentation, not warning strictness (that's the build job's
      # job) — keep it decoupled so a sanitizer-only concern here never
      # depends on the warning-strictness build passing first, or vice
      # versa.
      - name: Build with ASan + UBSan
        run: |
          make clean
          make CFLAGS="-O0 -g -fsanitize=address,undefined -fno-omit-frame-pointer"

      # The unit suites under instrumentation — where the hostile-input
      # cases in tests/ actually earn their keep: a truncation or an
      # over-read that a CHECK can't see is exactly what ASan reports.
      #
      # halt_on_error=1 matches the smoke step below: a UBSan report that
      # only prints leaves a green build sitting on undefined behaviour,
      # which is the same as not running UBSan at all.
      - name: Unit tests under ASan/UBSan
        run: |
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

      # No live grappa in CI, so this can't exercise a real login/bridge
      # round trip. What it CAN verify without one: the safety-default
      # config validation, and that the IRC line parser survives a
      # burst of malformed/hostile input on a real accepted connection
      # without ASan/UBSan flagging anything — this binary's own stated
      # threat model (Makefile's own comment: "parses hostile bytes ...
      # so the hardening earns its keep").
      - name: Non-loopback plain bind is refused without --insecure
        run: |
          cat > refuse.config <<'EOF'
          grappa-url https://127.0.0.1:1
          bind 0.0.0.0 17667 plain
          EOF
          ! ./bicchierino --config refuse.config

      - name: Smoke test — malformed input under ASan/UBSan
        run: |
          cat > smoke.config <<'EOF'
          grappa-url https://127.0.0.1:1
          bind 127.0.0.1 17667 plain
          EOF
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ./bicchierino --config smoke.config &
          BICCHIERINO_PID=$!
          sleep 1

          python3 - <<'EOF'
          import socket, time
          lines = [
              b"\r\n",
              b":\r\n",
              b"NICK\r\n",
              b"NICK " + b"A" * 4000 + b"\r\n",
              b"USER a b c :d\r\n",
              b"PASS \r\n",
              b"PASS " + b":" * 100 + b"\r\n",
              b"\x00\x01\x02\x03\r\n",
              b"CAP LS\r\n",
              b"CAP REQ :" + b"unknown-cap " * 200 + b"\r\n",
              ("x" * 8000).encode() + b"\r\n",
          ]
          for line in lines:
              try:
                  s = socket.create_connection(("127.0.0.1", 17667), timeout=2)
                  s.sendall(line)
                  time.sleep(0.1)
                  s.close()
              except OSError:
                  pass
          EOF

          sleep 1
          if ! kill -0 $BICCHIERINO_PID 2>/dev/null; then
            echo "bicchierino crashed while handling malformed input"
            exit 1
          fi
          kill $BICCHIERINO_PID
          wait $BICCHIERINO_PID 2>/dev/null || true

      # The cap and the registration deadline from #20. Neither is
      # unit-testable in any useful way — the cap arithmetic is inline in
      # main.c's accept loop, and what actually breaks is the invariant
      # that connection_run releases a slot on every exit path — so this
      # drives the real binary over real sockets instead.
      #
      # In THIS job rather than the build matrix, for two reasons: the
      # binary here is already instrumented, so the run doubles as
      # ASan/UBSan coverage of the accept and teardown paths; and python3
      # is already installed above for the smoke test. openssl, which the
      # script uses to mint a throwaway cert for its tls bind, ships on
      # the runner.
      #
      # Takes about a minute, most of it waiting out the 30s deadline it
      # is measuring.
      - name: Connection cap and registration deadline
        run: |
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            BIN=./bicchierino python3 tests/caps.py

  e2e:
    name: e2e — sealed azzurra stack
    runs-on: ubuntu-latest
    # Gate on the cheap build first — no point spending minutes on a cold
    # Elixir compile and a 6-container stack if the binary itself is broken.
    needs: build
    timeout-minutes: 30
    # compose.yaml is an override layer on top of azzurra-testnet/compose.yaml.
    # Docker Compose 2.27+ disallows redefining services/networks from a file
    # brought in via `include:`, which the override pattern requires. The
    # multi-file (-f) merge predates `include:` and handles overrides without
    # that constraint: the second file's keys win over the first's.
    #
    # COMPOSE_FILE lists both files; all steps cd into test/ first, so these
    # paths resolve to test/azzurra-testnet/compose.yaml and test/compose.yaml.
    # Docker Compose infers the project directory from the first file's location
    # (test/azzurra-testnet/), so ALL relative build contexts in test/compose.yaml
    # are authored as paths from that directory — see the context: values there.
    #
    # COMPOSE is also set so isolation.sh (which reads `COMPOSE` to learn
    # how to invoke docker compose) inherits the same env automatically.
    env:
      COMPOSE_FILE: azzurra-testnet/compose.yaml:compose.yaml
      COMPOSE: docker compose
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # test/grappa/{_build,deps} are bind-mounted from the checkout, not
      # baked into an image (grappa runs from source — see prepare.sh) —
      # so they live on the runner's filesystem and can be cached directly.
      # The cold compile this saves is the slow part of this job; the
      # pinned submodule commit's own mix.lock is the right cache key,
      # since a bumped grappa submodule invalidates it exactly when it
      # should.
      - name: Cache grappa build artifacts
        uses: actions/cache@v4
        with:
          path: |
            test/grappa/_build
            test/grappa/deps
          key: grappa-build-${{ hashFiles('test/grappa/mix.lock') }}

      - name: Resolve container uid/gid
        run: |
          echo "CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      # Needs the network (Hex/rebar/deps, the throwaway CA) — done here,
      # unsealed and explicit, same reasoning as test/README.md: opening a
      # gateway inside the stack itself "just for setup" would leave the
      # ircds one config mistake away from production.
      - name: Prepare (certs + grappa deps/compile)
        run: cd test && ./prepare.sh

      - name: Bring up the sealed stack
        run: cd test && $COMPOSE up -d --wait

      # test/isolation.sh is the point of this job as much as functional
      # correctness is: it proves every network is internal (no gateway),
      # every container sits only on those networks, and egress to
      # azzurra.chat or anywhere else is actually impossible, not just
      # configured to be — verifying its own probe first so a broken
      # detector can't read as a sealed stack.
      - name: Prove the seal
        run: cd test && ./isolation.sh

      # Mechanically verify RFC 1459 wire compliance on the live bicchierino
      # instance.  Two sockets: the primary client connects through bicchierino
      # (port 6667); a second "leaf peer" connects directly to bahamut-test
      # (port 6667) inside bicc-net, generating real IRC events that the primary
      # client asserts.  Covered: CRLF termination, ≤512-byte lines, numeric
      # format, 001-004 registration burst, PRIVMSG (channel + DM), NOTICE
      # (user and server-sourced — the #29 regression), CTCP ACTION framing
      # (the double-wrap regression), KICK (via OperServ MODE), TOPIC
      # (332/333 + live echo), WHOIS (311/312/317/319/318), WHO (352+315),
      # NAMES (353/366 + sigil correctness — the CLAUDE.md §9 regression).
      - name: RFC 1459 compliance check
        run: |
          cd test
          bicc_net="$($COMPOSE ps --format '{{.Project}}' | head -1)_bicc-net"
          docker run --rm \
            --network "$bicc_net" \
            -v "$(pwd)/rfc1459_check.py:/check.py:ro" \
            python:3.12-slim python3 /check.py

      - name: Stack logs
        if: failure()
        run: cd test && $COMPOSE logs --tail=300

      - name: Tear down
        if: always()
        run: cd test && $COMPOSE down -v
