name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  # One .deb per architecture, each built natively — the arm64 one on
  # GitHub's arm64 runner, not cross-compiled, so the binary inside is the
  # one that runner's own toolchain and libssl produced, same as amd64.
  deb:
    name: build .deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags — the Makefile's own `git describe`
          # version derivation needs tag refs a shallow checkout won't
          # have, and a release build with the WRONG version baked in
          # is exactly the kind of thing worth failing loudly over, not
          # shipping quietly.
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Build release binary
        run: |
          make clean
          make CFLAGS="-O2 -Werror"

      - name: Verify the binary's own version matches this release tag
        run: |
          v=$(./bicchierino --version)
          echo "$v"
          echo "$v" | grep -q "bicchierino ${{ github.ref_name }}+" || \
            (echo "built version does not start with the triggering tag ${{ github.ref_name }} — refusing to publish a mislabeled release" && exit 1)

      # Read the version straight out of the Makefile's own computation
      # (the exact value already baked into the binary via
      # -DBICCHIERINO_VERSION) rather than recomputing it here — one
      # source of truth, so the .deb's Version field can never drift
      # from what the binary itself reports via --version. Debian
      # version syntax doesn't use the "v" prefix git tags do; strip it
      # here, not in the Makefile (which has its own reasons to keep
      # the "v" — it matches the tag name directly).
      - name: Build .deb
        run: |
          DEB_VERSION="$(make version | sed 's/^v//')"
          ./packaging/build-deb.sh "$DEB_VERSION" "${{ matrix.arch }}"
          mkdir -p dist
          mv bicchierino_*_${{ matrix.arch }}.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  # The Arch package, built by makepkg from packaging/arch/PKGBUILD the
  # same way a user's `makepkg -si` builds it — except that pkgver and the
  # source are pointed at THIS tag's checkout, so the asset is the tree
  # this workflow was triggered by, not whatever the committed pkgver names.
  # x86_64 only: Arch Linux proper has no other architecture.
  arch:
    name: build Arch package (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the Arch build toolchain
        run: pacman -Syu --noconfirm --needed base-devel git namcap

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # makepkg refuses to run as root, and the container runs as root.
      - name: Create an unprivileged build user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # pkgver may not contain a hyphen (makepkg rejects it), so a
      # pre-release tag's suffix is joined on: v1.2.3-rc1 -> 1.2.3rc1,
      # which pacman's vercmp orders BEFORE 1.2.3, as a pre-release should.
      - name: Point the recipe at this tag, then makepkg (check() runs the unit suites)
        working-directory: packaging/arch
        run: |
          pkgver="$(echo "${GITHUB_REF_NAME#v}" | tr -d -- -)"
          sed -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s|git+\${url}.git#tag=v\${pkgver}|git+file://${GITHUB_WORKSPACE}#tag=${GITHUB_REF_NAME}|" \
            PKGBUILD
          grep -E '^(pkgver|source)=' PKGBUILD
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder makepkg -sf --noconfirm

      - name: namcap (advisory)
        working-directory: packaging/arch
        run: sudo -u builder namcap PKGBUILD bicchierino-[0-9]*.pkg.tar.zst || true

      - name: Install it and check the binary reports this tag
        working-directory: packaging/arch
        run: |
          pacman -U --noconfirm bicchierino-[0-9]*.pkg.tar.zst
          v=$(bicchierino --version)
          echo "$v"
          echo "$v" | grep -q "bicchierino ${GITHUB_REF_NAME}+" || \
            (echo "packaged binary does not report ${GITHUB_REF_NAME}" && exit 1)
          getent passwd bicchierino
          test -d /var/log/bicchierino

      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: packaging/arch/bicchierino-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  # Publishes only when every package built: a release is public the
  # moment it exists, and one missing an architecture would read as
  # "not supported" rather than "the build broke".
  release:
    needs: [deb, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Source tarball
        run: |
          SOURCE_VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="bicchierino-${SOURCE_VERSION}/" \
            -o "dist/bicchierino-${SOURCE_VERSION}-source.tar.gz" \
            "${{ github.ref_name }}"
          ls -l dist

      # Pinned static binary, same reasoning as semver.yml: one less
      # third party in the trust chain for something this simple.
      - name: Install git-cliff
        run: |
          GIT_CLIFF_VERSION=2.13.1
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff

      # --current: just this tag's commits (HEAD IS the tag that
      # triggered this workflow), not the whole project history.
      # --strip header drops git-cliff's own top-level "# Changelog"
      # title, which would be redundant — GitHub's release page already
      # shows the version prominently in its own UI chrome.
      - name: Generate release notes from Conventional Commits
        run: git-cliff --current --strip header -o RELEASE_NOTES.md

      # A tag with a hyphen (v1.2.3-rc1) is a semver pre-release, and is
      # published as one.
      - name: Create GitHub release
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
