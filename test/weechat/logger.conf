#
# One log file per buffer, which is what makes "where did this land?"
# answerable from the filesystem instead of by scraping the TUI: the mask
# below yields e.g. irc.server.bicchierinotest.weechatlog for the server
# buffer and irc.bicchierinotest.#chan.weechatlog for a channel.
#

[file]
auto_log = on
mask = "$plugin.$name.weechatlog"
# Default is 120s. A test that quits before the flush finds empty logs, so
# write promptly instead of relying on /quit to flush.
flush_delay = 1
