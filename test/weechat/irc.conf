#
# Minimal IRC config for the test stack: one server, and it is the
# bicchierino in this compose.
#
# Deliberately not a copy of anyone's real setup. The value of having a
# real client in the stack is that the bridge is exercised by something
# that speaks IRC properly, not that any particular routing config is
# reproduced — so this holds the bare minimum and stays out of the way.
# Mount your own over /home/user/.config/weechat to validate a real one.
#

[server_default]
autoconnect = off
autojoin = ""

[server]
BicchierinoTest.addresses = "bicchierino/6667"
BicchierinoTest.tls = off
BicchierinoTest.autoconnect = on
BicchierinoTest.nicks = "tester"
BicchierinoTest.username = "bicc"
BicchierinoTest.realname = "bicchierino test stack"
# bicchierino reads PASS as "<network>:<password>": the grappa network slug
# to bridge, then that account's password. Both are seeded by grappa-seed
# in compose.yaml.
BicchierinoTest.password = "bahamut-test:test-password-not-secret"
