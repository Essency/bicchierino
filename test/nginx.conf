# TLS in front of grappa, for one reason: bicchierino will not speak
# anything else.
#
# GRAPPA_URL_PREFIX is "https://" and parse_grappa_url rejects every other
# scheme, and the connection verifies the chain and the hostname with no
# way to turn either off. That is correct for a binary whose downstream
# clients hand it real passwords inside PASS — so the test stack brings
# TLS to it rather than asking it to accept less.
#
# Both legs go through here: the REST calls and the Phoenix Channels
# websocket, which is why the Upgrade/Connection dance below is not
# optional — without it the socket handshake gets a plain 200 and
# ws_client_connect fails its `101 Switching Protocols` check.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    access_log off;

    # Keep the temp paths under /tmp: this runs unprivileged, and the
    # image's default prefixes are not writable by that uid.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream grappa_upstream {
        server grappa:4000;
    }

    server {
        listen 443 ssl;
        server_name grappa-tls;

        ssl_certificate     /certs/grappa-tls.pem;
        ssl_certificate_key /certs/grappa-tls.key;
        # bicchierino sets TLS 1.2 as its floor and refuses to downgrade
        # below it; matching that here means a handshake failure is a real
        # failure and not a version mismatch nobody meant.
        ssl_protocols TLSv1.2 TLSv1.3;

        # grappa streams Phoenix Channels frames; buffering them would
        # turn a push feed into a stalled one.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://grappa_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # grappa roots Endpoint.url() at PHX_HOST; keep the Host it
            # sees equal to the name bicchierino dialled so any URL it
            # mints comes back pointing at something reachable.
            proxy_set_header Host       $host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
